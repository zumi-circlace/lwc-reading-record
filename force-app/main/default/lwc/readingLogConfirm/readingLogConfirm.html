<template>
    <div>
        <template lwc:if={hasExistingLogs}>
            <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                同じ本の記録がすでにあります。既存を開くか、再読として追加できます。
            </div>
            <ul class="slds-m-bottom_medium">
                <template for:each={existingLogs} for:item="log">
                    <li key={log.logId} class="slds-m-bottom_x-small">
                        <lightning-button
                            variant="base"
                            label={log.displayName}
                            data-id={log.logId}
                            onclick={handleOpenExisting}
                        ></lightning-button>
                    </li>
                </template>
            </ul>
        </template>

        <div class="slds-grid slds-gutters slds-wrap">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4" lwc:if={hasCover}>
                <img src={coverUrl} alt={title} class="cover" referrerpolicy="no-referrer" />
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-4">
                <lightning-input
                    data-field="title"
                    label="タイトル"
                    value={title}
                    required
                    onchange={handleChange}
                ></lightning-input>
                <lightning-input data-field="isbn" label="ISBN" value={isbn} onchange={handleChange}></lightning-input>
                <lightning-input data-field="author" label="著者" value={author} onchange={handleChange}></lightning-input>
                <lightning-input
                    data-field="publisher"
                    label="出版社"
                    value={publisher}
                    onchange={handleChange}
                ></lightning-input>
                <lightning-input
                    data-field="publishedYear"
                    label="出版年"
                    value={publishedYear}
                    onchange={handleChange}
                ></lightning-input>
                <lightning-combobox
                    data-field="category"
                    label="カテゴリ"
                    value={category}
                    options={categoryOptions}
                    onchange={handleChange}
                ></lightning-combobox>
                <lightning-input
                    data-field="readDate"
                    type="date"
                    label="読了日"
                    value={readDate}
                    required
                    onchange={handleChange}
                ></lightning-input>
                <lightning-textarea
                    data-field="description"
                    label="感想"
                    value={description}
                    onchange={handleChange}
                ></lightning-textarea>
            </div>
        </div>

        <div class="slds-m-top_medium">
            <lightning-button label="戻る" onclick={handleCancel} disabled={saving}></lightning-button>
            <lightning-button
                class="slds-m-left_small"
                variant="brand"
                label="保存"
                onclick={handleSave}
                disabled={saving}
            ></lightning-button>
        </div>
    </div>
</template>
